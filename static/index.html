<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>上市公司资产负债表看板</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">资产负债表</p>
          <h1>上市公司资产负债表看板</h1>
        </div>
        <form id="stock-form" class="stock-form">
          <input id="stock-code" value="002594" aria-label="股票代码" maxlength="6" />
          <input id="stock-name" value="比亚迪" aria-label="公司名称" />
          <button type="submit">刷新</button>
        </form>
      </header>

      <nav class="tabs" aria-label="看板页签">
        <button class="tab active" type="button" data-view="balance">资产负债表</button>
        <button class="tab" type="button" data-view="trend">股价与营收</button>
        <button class="tab" type="button" data-view="valuation">估值</button>
        <button class="tab" type="button" data-view="basic">基本信息</button>
      </nav>

      <section class="board">
        <div id="period-actions" class="period-actions">
          <button id="current-period" type="button">当期数据</button>
          <button id="prev-period" type="button">上一期</button>
          <button id="next-period" type="button">下一期</button>
        </div>

        <div id="error" class="error" hidden></div>
        <div id="loading" class="loading">正在读取财报数据...</div>

        <section id="chart-panel" class="chart-panel" hidden>
          <div class="chart-title">
            <h2 id="chart-heading">资产负债表</h2>
            <p id="report-date"></p>
          </div>

          <div class="summary-grid">
            <div>
              <span>资产总计</span>
              <strong id="total-assets">--</strong>
            </div>
            <div>
              <span>负债合计</span>
              <strong id="total-liabilities">--</strong>
            </div>
            <div>
              <span>所有者权益</span>
              <strong id="equity">--</strong>
            </div>
            <div>
              <span>资产负债率</span>
              <strong id="debt-ratio">--</strong>
            </div>
          </div>

          <div class="chart-wrap">
            <div id="y-axis" class="y-axis"></div>
            <div id="bars" class="bars" aria-label="资产负债项目柱状图"></div>
          </div>
          <div class="legend">
            <span><i class="asset-dot"></i>资产项目</span>
            <span><i class="liability-dot"></i>负债项目</span>
            <span>单位：亿元</span>
          </div>
        </section>

        <section id="trend-panel" class="trend-panel" hidden>
          <div class="chart-title">
            <h2 id="trend-heading">公司股价与年化营收趋势</h2>
            <p id="trend-subtitle">最近 32 个报告期；股价按周采样至最近完整交易日</p>
          </div>

          <div class="summary-grid trend-summary">
            <div>
              <span>最新年化营收</span>
              <strong id="latest-revenue">--</strong>
            </div>
            <div>
              <span>最新股价</span>
              <strong id="latest-price">--</strong>
            </div>
            <div>
              <span>最新报告期</span>
              <strong id="latest-trend-date">--</strong>
            </div>
            <div>
              <span>数据点</span>
              <strong id="trend-point-count">--</strong>
            </div>
          </div>

          <div class="trend-chart-wrap">
            <svg id="trend-svg" role="img" aria-label="股价与年化营收趋势图"></svg>
          </div>
          <div class="legend">
            <span><i class="asset-dot"></i>年化总营收</span>
            <span><i class="line-dot"></i>东财前复权股价</span>
            <span>营收单位：亿元；股价单位：元</span>
          </div>
        </section>

        <section id="valuation-panel" class="valuation-panel" hidden>
          <form id="valuation-form" class="valuation-form">
            <label>预测年限
              <select id="forecast-years">
                <option value="3">3 年</option>
                <option value="5" selected>5 年</option>
                <option value="10">10 年</option>
              </select>
            </label>
            <label>保守增长率
              <input id="growth-conservative" type="number" value="5" step="0.5" />
            </label>
            <label>中性增长率
              <input id="growth-neutral" type="number" value="10" step="0.5" />
            </label>
            <label>乐观增长率
              <input id="growth-optimistic" type="number" value="15" step="0.5" />
            </label>
            <label>折现率
              <input id="discount-rate" type="number" value="10" step="0.5" />
            </label>
            <label>永续增长率
              <input id="perpetual-growth-rate" type="number" value="2.5" step="0.5" />
            </label>
            <label>安全边际
              <input id="safety-margin" type="number" value="25" step="1" />
            </label>
            <button type="submit">生成估值</button>
          </form>

          <div class="summary-grid valuation-summary">
            <div><span>当前股价</span><strong id="valuation-current-price">--</strong></div>
            <div><span>中性 DCF</span><strong id="valuation-neutral-value">--</strong></div>
            <div><span>折价/溢价</span><strong id="valuation-discount">--</strong></div>
            <div><span>安全买入价</span><strong id="valuation-safety-price">--</strong></div>
          </div>

          <div class="valuation-chart-wrap">
            <svg id="valuation-svg" role="img" aria-label="DCF 估值带与股价走势"></svg>
          </div>

          <div class="summary-grid valuation-ratios">
            <div><span>当前市值</span><strong id="valuation-market-cap">--</strong></div>
            <div><span>PE</span><strong id="valuation-pe">--</strong></div>
            <div><span>PB</span><strong id="valuation-pb">--</strong></div>
            <div><span>PS</span><strong id="valuation-ps">--</strong></div>
          </div>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
